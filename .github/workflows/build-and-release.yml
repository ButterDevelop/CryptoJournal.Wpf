name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  verify:
    name: Build and test
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CryptoJournal.Wpf.slnx

      - name: Build
        run: dotnet build CryptoJournal.Wpf.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CryptoJournal.Wpf.slnx --configuration Release --no-build --no-restore

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$')
          {
              throw "Release tag '$tag' must use the vX.Y.Z format."
          }

          "value=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/Build-Installer.ps1 -Version $env:RELEASE_VERSION

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: CryptoJournal-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/installer/Setup_CryptoJournal_${{ steps.version.outputs.value }}.exe
            artifacts/installer/Setup_CryptoJournal_${{ steps.version.outputs.value }}.exe.sha256
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $installer = "artifacts/installer/Setup_CryptoJournal_$($env:RELEASE_VERSION).exe"
          $checksum = "$installer.sha256"

          gh release create $env:RELEASE_TAG `
              $installer `
              $checksum `
              --verify-tag `
              --generate-notes `
              --title "CryptoJournal $env:RELEASE_TAG"
